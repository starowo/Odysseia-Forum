[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odysseia-forum"
version = "1.3.1"
description = "Discord论坛搜索机器人"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "discord.py[speed]>=2.3.0",
    "aiohttp>=3.8.0",
    "sqlmodel==0.0.19",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "rjieba",
    "opencc>=1.4.2",
    "alembic",
    "fastapi",
    "uvicorn[standard]",
    "uvloop; platform_system != 'Windows'",
    "httpx",
    "cryptography>=45.0.0",
    "redis>=5.0.0",
    "orjson>=3.11.2",
    "aioboto3>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
