<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Odysseia V2 Prototype - Solid Architecture</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#0a0c10',
            surface: '#161920',
            surfaceHover: '#20242d',
            primary: '#6366f1',
            textMain: '#f8fafc',
            textMuted: '#94a3b8'
          },
          borderRadius: {
            'xl': '1rem',
            '2xl': '1.5rem',
            '3xl': '2rem',
            '4xl': '2.5rem',
          }
        }
      }
    }
  </script>

  <!-- Import Maps for React & Framer Motion -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "framer-motion": "https://esm.sh/framer-motion@11.0.8?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.358.0?external=react"
      }
    }
  </script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    body { background-color: #0a0c10; color: #f8fafc; margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import { Search, Home, Compass, Bookmark, User, Bell, ChevronRight, Hash, Image as ImageIcon, Heart, Download, Star, Command, CornerDownLeft } from 'lucide-react';

    // --- Mock Data ---
    const MOCK_CARDS = [
      { id: 1, title: '赛博朋克 2077 高清截图包', author: 'V_Legend', avatar: 'https://i.pravatar.cc/150?u=1', tags: ['游戏', '壁纸'], img: 'https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?auto=format&fit=crop&w=600&q=80', height: 'h-64' },
      { id: 2, title: '初音未来 3D 模型素材', author: 'MikuFan', avatar: 'https://i.pravatar.cc/150?u=2', tags: ['3D', 'Vocaloid'], img: 'https://images.unsplash.com/photo-1614113489855-66422ad300a4?auto=format&fit=crop&w=600&q=80', height: 'h-80' },
      { id: 3, title: '自然风景参考图集 - 森林篇', author: 'NatureLover', avatar: 'https://i.pravatar.cc/150?u=3', tags: ['摄影', '参考'], img: 'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80', height: 'h-56' },
      { id: 4, title: '复古像素风 UI 组件包', author: 'PixelArt', avatar: 'https://i.pravatar.cc/150?u=4', tags: ['UI', '像素'], img: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80', height: 'h-72' },
      { id: 5, title: '未来城市夜景原画', author: 'ConceptPro', avatar: 'https://i.pravatar.cc/150?u=5', tags: ['原画', '赛博朋克'], img: 'https://images.unsplash.com/photo-1515630278258-407f66498911?auto=format&fit=crop&w=600&q=80', height: 'h-96' },
      { id: 6, title: '极简风格排版模板', author: 'DesignUI', avatar: 'https://i.pravatar.cc/150?u=6', tags: ['排版', '设计'], img: 'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=600&q=80', height: 'h-64' },
    ];

    // --- Hooks ---
    function useOnClickOutside(ref, handler) {
      useEffect(() => {
        const listener = (event) => {
          if (!ref.current || ref.current.contains(event.target)) return;
          handler(event);
        };
        document.addEventListener('mousedown', listener);
        return () => document.removeEventListener('mousedown', listener);
      }, [ref, handler]);
    }

    // --- Components ---

    // 1. 顶栏搜索框 (响应式定位升级版)
    const SearchBar = () => {
      const [query, setQuery] = useState('');
      const [isFocused, setIsFocused] = useState(false);
      const containerRef = useRef(null);

      useOnClickOutside(containerRef, () => setIsFocused(false));

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'k' && (e.metaKey || e.ctrlKey)) {
            e.preventDefault();
            const input = containerRef.current?.querySelector('input');
            if (input) input.focus();
          }
          if (e.key === 'Escape' && isFocused) {
            setIsFocused(false);
            const input = containerRef.current?.querySelector('input');
            if (input) input.blur();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isFocused]);

      return (
        <div className="relative flex-1 flex justify-end z-50" ref={containerRef}>
          {/* 输入框本体 */}
          <div
            className={`
              flex items-center bg-surface border transition-all duration-300 ease-out overflow-hidden relative z-50
              ${isFocused ? 'border-primary/50 w-full sm:w-[480px] shadow-lg shadow-primary/10 rounded-2xl' : 'border-white/5 w-10 sm:w-64 rounded-full hover:border-white/20'}
            `}
          >
            <div className={`p-2 sm:pl-3 transition-colors ${isFocused ? 'text-primary' : 'text-textMuted'}`}>
              <Search className="w-4 h-4 sm:w-5 sm:h-5" />
            </div>
            <input
              type="text"
              placeholder="搜索资源、标签、作者..."
              className={`flex-1 bg-transparent border-none outline-none text-sm text-white placeholder-gray-500 py-2 sm:py-2.5 ${!isFocused && 'hidden sm:block'}`}
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              onFocus={() => setIsFocused(true)}
            />
            {!isFocused ? (
              <div className="hidden sm:flex items-center pr-3">
                <span className="flex items-center gap-0.5 text-[10px] text-gray-500 border border-gray-700/50 bg-gray-800/50 px-1.5 py-0.5 rounded shadow-sm">
                  <Command className="w-3 h-3" /> K
                </span>
              </div>
            ) : (
              query && (
                <div className="hidden sm:flex items-center pr-3 animate-pulse">
                  <span className="flex items-center gap-1 text-[10px] text-primary bg-primary/10 px-2 py-1 rounded">
                    <CornerDownLeft className="w-3 h-3" /> 搜索
                  </span>
                </div>
              )
            )}
          </div>

          {/* 悬浮联想下拉面板 - 层级与定位重构 */}
          <AnimatePresence>
            {isFocused && (
              <>
                {/* 全局遮罩：在移动端阻挡背景点击，在 PC 端透明 */}
                <motion.div
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  exit={{ opacity: 0 }}
                  className="fixed inset-0 bg-black/60 sm:bg-transparent z-40 backdrop-blur-sm sm:backdrop-blur-none"
                  onClick={() => setIsFocused(false)}
                />

                {/* 下拉面板：移动端居中浮动，PC端吸附输入框 */}
                <motion.div
                  initial={{ opacity: 0, y: 10, scale: 0.98 }}
                  animate={{ opacity: 1, y: 0, scale: 1 }}
                  exit={{ opacity: 0, y: 5, scale: 0.98 }}
                  transition={{ duration: 0.2, ease: "easeOut" }}
                  className="fixed top-20 left-4 right-4 sm:absolute sm:top-full sm:left-auto sm:right-0 sm:mt-3 sm:w-[480px] bg-surface border border-white/10 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[75vh] z-50 origin-top sm:origin-top-right"
                >
                  {/* 联想与结果预览区 */}
                  <div className="p-4 overflow-y-auto">
                    {!query ? (
                      <div className="text-sm text-textMuted">
                        <p className="mb-3 text-xs font-semibold text-gray-500 tracking-wider">最近搜索</p>
                        <div className="flex flex-wrap gap-2 mb-6">
                          {['赛博朋克', '3D模型', '风景参考'].map(tag => (
                            <span key={tag} className="px-3 py-1.5 bg-gray-800/50 border border-gray-700/50 hover:bg-gray-700 rounded-lg cursor-pointer transition-colors text-gray-300 hover:text-white flex items-center gap-1">
                              <Search className="w-3 h-3 text-gray-500"/> {tag}
                            </span>
                          ))}
                        </div>
                        <p className="mb-3 text-xs font-semibold text-gray-500 tracking-wider">猜你想搜</p>
                        <div className="flex flex-wrap gap-2">
                          {['# UI', '# 像素风', '# 材质贴图', '# 二次元'].map(tag => (
                            <span key={tag} className="px-3 py-1 bg-surfaceHover hover:bg-gray-700 rounded-full cursor-pointer transition-colors text-primary text-xs">
                              {tag}
                            </span>
                          ))}
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-5">
                        {/* 相关标签 */}
                        <div>
                          <p className="text-[10px] font-bold text-gray-500 mb-2 uppercase tracking-wider flex items-center"><Hash className="w-3 h-3 mr-1"/> 相关标签</p>
                          <div className="flex items-center justify-between p-2 hover:bg-surfaceHover rounded-xl cursor-pointer transition-colors">
                            <p className="text-white text-sm">与 <span className="text-primary font-bold">"{query}"</span> 相关的标签</p>
                            <span className="text-xs text-gray-500 bg-gray-800/80 px-2 py-0.5 rounded-full">1,024 帖子</span>
                          </div>
                        </div>

                        {/* 相关作者 */}
                        <div>
                          <p className="text-[10px] font-bold text-gray-500 mb-2 uppercase tracking-wider flex items-center"><User className="w-3 h-3 mr-1"/> 相关作者</p>
                          <div className="flex items-center p-2 hover:bg-surfaceHover rounded-xl cursor-pointer transition-colors group">
                            <img src="https://i.pravatar.cc/150?u=v" className="w-8 h-8 rounded-full mr-3 border border-gray-700 group-hover:border-primary/50 transition-colors" />
                            <div>
                              <p className="text-white text-sm font-medium group-hover:text-primary transition-colors">V_Legend</p>
                              <p className="text-[10px] text-gray-500">241 个相关资源</p>
                            </div>
                          </div>
                        </div>

                        {/* 帖子预览 */}
                        <div>
                          <p className="text-[10px] font-bold text-gray-500 mb-2 uppercase tracking-wider flex items-center"><ImageIcon className="w-3 h-3 mr-1"/> 资源预览</p>
                          <div className="grid grid-cols-1 gap-2">
                            {MOCK_CARDS.slice(0,3).map(card => (
                              <div key={card.id} className="flex items-center bg-gray-800/20 p-2 rounded-xl hover:bg-surfaceHover transition-colors cursor-pointer">
                                <img src={card.img} className="w-10 h-10 rounded-lg object-cover mr-3" />
                                <div className="flex-1 min-w-0">
                                  <p className="text-sm text-white truncate leading-tight">{card.title}</p>
                                  <p className="text-[10px] text-gray-500 truncate mt-0.5">by {card.author}</p>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* 底部行动引导 */}
                  <div className="bg-[#101218] p-3 text-center border-t border-white/5 cursor-pointer hover:bg-[#1a1d24] transition-colors">
                    <span className="text-xs text-primary font-medium flex items-center justify-center gap-1">
                      查看 "{query || '全站'}" 的所有搜索结果 <ChevronRight className="w-3 h-3" />
                    </span>
                  </div>
                </motion.div>
              </>
            )}
          </AnimatePresence>
        </div>
      );
    };

    // 2. 瀑布流资源卡片
    const ResourceCard = ({ data }) => {
      return (
        <motion.article
          className="group relative rounded-2xl overflow-hidden bg-background mb-6 border border-white/5 cursor-pointer shadow-lg hover:shadow-primary/10 transition-shadow duration-300"
          initial={{ opacity: 0, y: 20 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.4 }}
        >
          <div className={`relative w-full ${data.height} overflow-hidden bg-gray-900`}>
            <motion.img
              src={data.img}
              alt={data.title}
              className="w-full h-full object-cover"
              whileHover={{ scale: 1.05 }}
              transition={{ duration: 0.4, ease: "easeOut" }}
            />
            <motion.div
              className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 via-black/40 to-transparent flex justify-end gap-2"
              initial={{ opacity: 0, y: 20 }}
              whileHover={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.2 }}
            >
              <button className="p-2 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-full text-white transition-colors">
                <Heart className="w-4 h-4" />
              </button>
              <button className="p-2 bg-primary hover:bg-primary/80 backdrop-blur-md rounded-full text-white transition-colors shadow-lg shadow-primary/30">
                <Download className="w-4 h-4" />
              </button>
            </motion.div>
          </div>

          <div className="p-4 bg-surface relative z-10">
            <h3 className="text-sm font-semibold text-white mb-2 line-clamp-2 leading-snug">{data.title}</h3>
            <div className="flex items-center justify-between mt-3">
              <div className="flex items-center gap-2">
                <img src={data.avatar} className="w-5 h-5 rounded-full border border-gray-700" />
                <span className="text-xs text-textMuted truncate max-w-[80px]">{data.author}</span>
              </div>
              <div className="flex gap-1">
                {data.tags.slice(0,1).map(t => (
                  <span key={t} className="text-[10px] px-2 py-0.5 bg-[#0a0c10] border border-white/5 text-gray-300 rounded-md">
                    {t}
                  </span>
                ))}
              </div>
            </div>
          </div>
        </motion.article>
      );
    };

    // --- Main Layout ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('home');

      return (
        // Root Container: 最外层控制全屏与背景
        <div className="h-screen w-full flex bg-background font-sans text-textMain overflow-hidden">

          {/* Sidebar (Desktop) - 语义化修改为 <aside> */}
          <aside className="hidden md:flex flex-col w-20 lg:w-64 h-full py-6 px-4 z-40 relative">
            <header className="flex items-center justify-center lg:justify-start lg:px-2 mb-10">
              <div className="w-10 h-10 bg-gradient-to-tr from-primary to-purple-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary/20">
                <span className="text-white font-bold text-xl">O</span>
              </div>
              <span className="hidden lg:block ml-3 font-bold text-xl tracking-tight text-white">Odysseia</span>
            </header>

            {/* 真正的导航包裹在 <nav> 中 */}
            <nav className="flex flex-col gap-2 flex-1">
              {[
                { id:'home', icon: Home, label: '广场' },
                { id:'explore', icon: Compass, label: '发现' },
                { id:'follows', icon: Bookmark, label: '收藏' },
                { id:'profile', icon: User, label: '我的' },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`flex items-center px-3 py-3 rounded-xl transition-all duration-200 group ${
                    activeTab === item.id
                      ? 'bg-surface text-primary font-medium shadow-sm'
                      : 'text-textMuted hover:bg-surface hover:text-white'
                  }`}
                >
                  <item.icon className={`w-5 h-5 lg:mr-4 ${activeTab === item.id ? 'text-primary' : 'group-hover:scale-110 transition-transform'}`} />
                  <span className="hidden lg:block text-sm">{item.label}</span>
                </button>
              ))}
            </nav>

            {/* User brief */}
            <footer className="mt-auto hidden lg:flex items-center px-3 py-3 cursor-pointer hover:bg-surface rounded-xl transition-colors">
              <img src="https://i.pravatar.cc/150?u=user" className="w-9 h-9 rounded-full border-2 border-gray-800" />
              <div className="ml-3 flex-1">
                <p className="text-sm font-medium text-white leading-tight">Guest_77</p>
                <p className="text-[10px] text-gray-500">Lv.1 探索者</p>
              </div>
            </footer>
          </aside>

          {/* Main Content Wrapper - 负责右侧区域的 Flex 堆叠 */}
          <div className="flex-1 flex flex-col min-w-0 h-full relative z-0">

            {/* Top Bar - 与背景融合 */}
            <header className="h-20 px-4 sm:px-6 flex items-center justify-between shrink-0 z-30 relative">
              <div className="flex items-center gap-3 relative z-10">
                {/* 情感化看板娘 */}
                <div className="w-10 h-10 bg-surface rounded-full flex items-center justify-center text-xl shadow-inner border border-white/5">
                  🦊
                </div>
                <div className="hidden sm:block">
                  <h1 className="text-sm font-bold text-white leading-tight">晚安，指挥官</h1>
                  <p className="text-[10px] text-textMuted">今日新增 128 个优质资源</p>
                </div>
              </div>

              <div className="flex items-center gap-3 relative z-50">
                <SearchBar />
                <button className="relative p-2 text-textMuted hover:text-white transition-colors bg-surface rounded-full border border-white/5 hover:border-white/10 shrink-0">
                  <Bell className="w-4 h-4 sm:w-5 sm:h-5" />
                  <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-surface"></span>
                </button>
              </div>
            </header>

            {/* Scrolling Content Container - 明确的语义与隔离的滚动区 */}
            <main
              id="main-scroll-container"
              className="flex-1 bg-surface sm:rounded-tl-[2.5rem] sm:border-t sm:border-l border-white/5 shadow-2xl overflow-y-auto scroll-smooth relative z-0 pb-20 md:pb-0"
            >
              {/* 高光内阴影修饰 */}
              <div className="absolute top-0 left-0 right-0 h-32 bg-gradient-to-b from-white/[0.02] to-transparent pointer-events-none rounded-tl-[2.5rem]"></div>

              <div className="p-4 sm:p-8 max-w-7xl mx-auto w-full relative z-10">

                {/* Banner Area */}
                <section className="mb-8 relative rounded-3xl overflow-hidden bg-gradient-to-r from-primary/20 to-purple-900/20 border border-primary/20 p-6 sm:p-10 flex flex-col justify-center min-h-[240px]">
                  <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1000&q=80')] opacity-30 mix-blend-overlay object-cover"></div>
                  <div className="relative z-10 max-w-lg">
                    <span className="inline-block px-3 py-1 bg-primary/20 text-primary text-xs font-bold rounded-full mb-4 backdrop-blur-md border border-primary/30">官方精选</span>
                    <h2 className="text-3xl sm:text-4xl font-bold text-white mb-3">复古像素艺术周</h2>
                    <p className="text-sm text-gray-300 mb-6 line-clamp-2 leading-relaxed">探索来自全球顶级画师的像素风佳作，一键打包带走最纯粹的怀旧质感。本周限时全量开放。</p>
                    <button className="px-6 py-2.5 bg-white text-black text-sm font-bold rounded-xl hover:bg-gray-200 transition-colors shadow-lg">立即探索</button>
                  </div>
                </section>

                {/* 热门统计小组件 */}
                <section className="flex gap-4 mb-8 overflow-x-auto pb-4 scrollbar-hide">
                  {['今日热门榜单', '3D模型区上新', '原画与参考推荐'].map((title, i) => (
                    <div key={title} className="flex-none w-52 bg-background/50 p-4 rounded-2xl border border-white/5 cursor-pointer hover:bg-surfaceHover transition-colors group">
                      <div className="w-10 h-10 rounded-xl bg-surface flex items-center justify-center mb-3 shadow-sm border border-white/5 group-hover:scale-105 transition-transform">
                        <Star className="w-5 h-5 text-yellow-500" />
                      </div>
                      <p className="text-sm font-bold text-white">{title}</p>
                      <p className="text-xs text-textMuted mt-1">浏览频道 <ChevronRight className="inline w-3 h-3 group-hover:translate-x-1 transition-transform"/></p>
                    </div>
                  ))}
                </section>

                {/* 瀑布流内容区 (For You Feed) */}
                <section>
                  <div className="flex items-center justify-between mb-6">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <span className="text-2xl">✨</span> 猜你喜欢
                    </h2>
                    <div className="flex bg-background/50 rounded-lg p-1 border border-white/5">
                      <button className="px-3 py-1.5 bg-surface text-white rounded-md text-xs font-medium shadow-sm border border-white/5">大图</button>
                      <button className="px-3 py-1.5 text-textMuted hover:text-white rounded-md text-xs font-medium transition-colors">紧凑</button>
                    </div>
                  </div>

                  <div className="columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-6 space-y-6">
                    {MOCK_CARDS.map(card => (
                      <div key={card.id} className="break-inside-avoid">
                        <ResourceCard data={card} />
                      </div>
                    ))}
                     {MOCK_CARDS.map(card => (
                      <div key={`${card.id}-copy`} className="break-inside-avoid">
                        <ResourceCard data={{...card, img: card.img + '&sig=' + Math.random()}} />
                      </div>
                    ))}
                  </div>
                </section>

              </div>
            </main>
          </div>

          {/* 移动端底部原生 Tab - 修正安全区 Padding */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 h-[calc(4rem+env(safe-area-inset-bottom))] bg-surface/90 backdrop-blur-xl border-t border-white/5 z-40 flex items-center justify-around px-2 pb-[env(safe-area-inset-bottom)]">
            {[
              { id:'home', icon: Home, label: '广场' },
              { id:'explore', icon: Compass, label: '发现' },
              { id:'follows', icon: Bookmark, label: '收藏' },
              { id:'profile', icon: User, label: '我的' },
            ].map(item => (
              <button
                key={item.id}
                onClick={() => setActiveTab(item.id)}
                className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${
                  activeTab === item.id ? 'text-primary' : 'text-textMuted hover:text-white'
                }`}
              >
                <item.icon className={`w-5 h-5 ${activeTab === item.id ? 'fill-primary/20' : ''}`} />
                <span className="text-[10px] font-medium">{item.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
